name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Construire l'application Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier les fichiers
        run: |
          echo "Contenu du dépôt :"
          ls -la
          echo "Contenu du dossier app :"
          ls -la app
          echo "Contenu des sources :"
          find app/src -type f

      - name: Construire l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLog-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
