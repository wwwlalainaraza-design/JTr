name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : les secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD doivent tous les deux exister."
            echo "Lance d'abord le workflow « Créer la clé de signature », puis ajoute les deux secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jtr-release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/jtr-release.p12" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Construire l'APK signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Afficher l'empreinte de la clé (doit être la même à chaque fois)
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: JTr-release-apk
          path: app/build/outputs/apk/release/app-release.apk
 
