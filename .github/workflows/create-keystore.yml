name: Créer la clé de signature

# À lancer UNE SEULE FOIS, à la main. Il crée la clé qui signe l'application.
on:
  workflow_dispatch:

jobs:
  creer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Créer la clé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "STOP : une clé existe déjà (secret KEYSTORE_BASE64). Ne la remplace jamais, tu ne pourrais plus mettre l'application à jour."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : crée d'abord le secret KEYSTORE_PASSWORD."
            exit 1
          fi
          if [ ${#KEYSTORE_PASSWORD} -lt 20 ]; then
            echo "ERREUR : le mot de passe doit faire au moins 20 caractères."
            exit 1
          fi
          keytool -genkeypair -keystore jtr-release.p12 -storetype PKCS12 -alias jtr \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=JTr"
          base64 -w 0 jtr-release.p12 > jtr-release.p12.base64.txt
          keytool -list -keystore jtr-release.p12 -storepass "$KEYSTORE_PASSWORD" | grep -i "alias\|SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: cle-de-signature-JTr
          path: |
            jtr-release.p12
            jtr-release.p12.base64.txt
          retention-days: 2
