<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>JTr, maquette</title>
<style>
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --surface2:#E9EEF9; --ink:#0B1B3A; --muted:#5B6B8C; --line:#D9E0F0;
  --blue:#1D5BFF; --on-blue:#FFFFFF; --blue-soft:#DDE7FF;
  --hero:#1236C8;
  --gain:#0C9A68; --loss:#DB2F4A; --flat:#6F7C97; --on-sem:#FFFFFF;
  --gain-soft:#D6F4E7; --loss-soft:#FCDDE3; --flat-soft:#E6EAF2;
  --buy:#1D5BFF; --sell:#C96A00; --on-sell:#FFFFFF;
  --reel:#1D5BFF; --bt:#5B3FE6;
  --ict:#1D5BFF; --smc:#7A5AF8; --pa:#0A7C99;
  --shadow:0 1px 2px rgba(11,27,58,.06),0 10px 28px rgba(11,27,58,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#060D1E; --surface:#0E1932; --surface2:#162548; --ink:#E8EEFF; --muted:#8CA0C8; --line:#1E3160;
    --blue:#5B90FF; --on-blue:#04122E; --blue-soft:#16316D;
    --hero:#0F2D7A;
    --gain:#34D399; --loss:#FB7185; --flat:#9AA8C4; --on-sem:#05140F;
    --gain-soft:#0C3A2D; --loss-soft:#47182A; --flat-soft:#1A2644;
    --buy:#6EA0FF; --sell:#F5B04A; --on-sell:#2A1600;
    --reel:#5B90FF; --bt:#9B8AFF;
    --ict:#6EA0FF; --smc:#A592FF; --pa:#35C6E3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.35}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.screen{display:none;padding:18px 16px 24px}
.screen.active{display:block}
.screen.enter{animation:enter .26s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:17px;letter-spacing:-.01em;margin:24px 0 10px}
.muted{color:var(--muted)}
small{font-size:12.5px}
.press{transition:transform .12s ease,filter .12s ease}
.press:active{transform:scale(.95)}
.note{font-size:12.5px;color:var(--muted);margin:10px 4px 0}
.g{color:var(--gain)} .l{color:var(--loss)} .f{color:var(--flat)}

/* Marque */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;margin:2px 2px 14px}
.brand svg{width:30px;height:30px;border-radius:9px}

/* Hero */
.hero{background:var(--hero);color:#fff;border-radius:30px 30px 30px 8px;padding:20px 18px 14px;box-shadow:var(--shadow)}
.hero>small{opacity:.78;font-size:13px}
.hero .big{font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:2px 0 6px}
.hero .big span{font-size:24px;font-weight:600;margin-left:6px;opacity:.8;letter-spacing:0}
.hero .mini{display:flex;gap:18px;font-size:13px;opacity:.9}
.hero svg{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.hero .empty-curve{margin:18px 0 14px;font-size:14px;opacity:.85}
.hero .seg{background:rgba(255,255,255,.14);margin-top:8px;--thumb:#fff}
.hero .seg button{color:rgba(255,255,255,.82)}
.hero .seg button.on{color:#0B1B3A}
.pulse{transform-origin:center;animation:pulse 1.8s ease-out 1.1s infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}

/* Segment */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:18px;padding:4px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,1));border-radius:14px;background:var(--thumb,var(--blue));
  transform:translateX(calc(var(--i,0)*100%));transition:transform .32s cubic-bezier(.3,1.25,.5,1),background .3s}
.seg button{position:relative;z-index:1;padding:11px 4px;border-radius:14px;font-weight:600;font-size:14.5px;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--on-blue)}

/* Cartes et indicateurs */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;padding:6px 16px}
.kpi{padding:12px 0;border-bottom:1px solid var(--line)}
.kpi:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.kpi:nth-child(even){padding-left:16px}
.kpi:nth-last-child(-n+2){border-bottom:0}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:12px}
.demo button{font-weight:700;color:var(--blue);padding:6px 8px}
.link{color:var(--blue);font-weight:600;font-size:14px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between}

/* Lignes de trades */
.trade{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border-radius:18px;padding:12px 14px 12px 0;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.trade .strip{align-self:stretch;border-radius:0 6px 6px 0;background:var(--c)}
.trade small{display:block;margin-top:2px}
.dirtag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:4px}
.dirtag.buy{background:var(--blue-soft);color:var(--buy)}
.dirtag.sell{background:rgba(201,106,0,.15);color:var(--sell)}
.rbadge{min-width:66px;text-align:center;padding:8px 10px;border-radius:12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.rbadge.gain{background:var(--gain-soft);color:var(--gain)}
.rbadge.loss{background:var(--loss-soft);color:var(--loss)}
.rbadge.flat{background:var(--flat-soft);color:var(--flat)}
.rbadge.pending{background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px}
.rbadge.lg{font-size:18px;padding:10px 14px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:8px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:9px 13px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--blue);color:var(--on-blue);animation:pop .24s ease}
.chip.res-gain.on{background:var(--gain);color:var(--on-sem)}
.chip.res-loss.on{background:var(--loss);color:var(--on-sem)}
.chip.res-flat.on{background:var(--flat);color:var(--on-sem)}
.chip.static{background:var(--surface2);font-size:13px;padding:7px 11px}
@keyframes pop{50%{transform:scale(1.09)}}

/* Formulaire */
.concepts{margin:14px 0 6px}
.concepts.swap{animation:swap .3s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.cgroup{margin-bottom:14px}
.gname{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
input:disabled{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.bad input,.field.bad select{border-color:var(--loss)}
.field .msg{color:var(--loss);font-size:12.5px;margin-top:6px}
.field.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.dir{padding:16px;border-radius:18px;font-weight:700;font-size:17px;background:var(--surface2);color:var(--muted);transition:background .2s,color .2s}
.dir.on.buy{background:var(--buy);color:var(--on-blue)}
.dir.on.sell{background:var(--sell);color:var(--on-sell)}
.rowsw{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow);font-weight:600}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--surface2);transition:background .25s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"] i{transform:translateX(22px)}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.expand.open{grid-template-rows:1fr}
.expand>div{overflow:hidden}
.savebar{position:sticky;bottom:calc(98px + env(safe-area-inset-bottom));margin-top:18px;z-index:5}
.primary{width:100%;padding:17px;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:17px;box-shadow:0 10px 24px rgba(29,91,255,.35)}
.ghost{width:100%;padding:14px;border-radius:16px;background:var(--surface2);font-weight:600}
.dangerbtn{width:100%;padding:14px;border-radius:16px;background:var(--loss-soft);color:var(--loss);font-weight:700}
.cancel{color:var(--muted);font-weight:600;font-size:14px;margin:0 0 8px;display:inline-block}

/* Statistiques */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1s cubic-bezier(.3,.7,.2,1)}
.ring b{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:28px;letter-spacing:-.03em}
.counts{display:grid;gap:8px;font-size:14px}
.counts div{display:flex;align-items:center;gap:8px}
.counts i{width:10px;height:10px;border-radius:50%}
.sblock{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:6px solid var(--c)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sname{font-weight:700;font-size:18px;color:var(--c)}
.spark{width:100%;height:34px;display:block;margin:8px 0 4px}
.spark path{stroke:var(--c)}
.smetrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.smetrics b{display:block;font-size:15px}
.smetrics span{font-size:11.5px;color:var(--muted)}
.brow{display:grid;grid-template-columns:104px 1fr 54px;gap:10px;align-items:center;margin:12px 0}
.blab b{display:block;font-size:14px}
.btrack{position:relative;height:16px;background:var(--surface2);border-radius:8px}
.btrack .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.bar{position:absolute;top:2px;bottom:2px;border-radius:6px;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.bar.pos{background:var(--gain);transform-origin:left}
.bar.neg{background:var(--loss);transform-origin:right}
@keyframes grow{from{transform:scaleX(0)}}
.bval{font-weight:700;font-size:14px;text-align:right}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs .card b{display:block;font-size:26px;letter-spacing:-.03em}
.empty{text-align:center;padding:36px 18px}
.empty p{color:var(--muted);margin:8px 0 18px}
.empty .primary{max-width:280px}

/* Paramètres */
.list{padding:6px 16px}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:16px 0;font-weight:600;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow small{color:var(--muted);font-weight:400}
.srow.danger{color:var(--loss)}

/* Barre d'onglets */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);
  box-shadow:0 -6px 24px rgba(11,27,58,.1);border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(14px + env(safe-area-inset-bottom));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:6px 0;transition:color .2s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.tab.active{color:var(--blue)}
.tab.active svg{transform:translateY(-2px) scale(1.12)}
.tab.fab .bubble{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;margin-top:-30px;
  box-shadow:0 8px 22px rgba(29,91,255,.45);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab.fab svg{stroke-width:2.6}
.tab.fab.active svg{transform:rotate(90deg)}
.tab.fab.active{color:var(--blue)}
.tabbar .bar-i{position:absolute;bottom:6px;left:6px;width:calc((100% - 12px)/5);height:4px;display:flex;justify-content:center;
  transform:translateX(calc(var(--i,0)*100%));transition:transform .38s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tabbar .bar-i::after{content:"";width:22px;height:4px;border-radius:4px;background:var(--blue)}

/* Feuille et message */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,10,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);background:var(--surface);
  border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:50;
  transition:transform .34s cubic-bezier(.2,.9,.25,1);max-height:86vh;max-height:86dvh;overflow:auto}
.sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.facts small{display:block;color:var(--muted)}
.facts b{font-size:14.5px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;
  transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Compte, concepts, captures */
body[data-acct="backtest"]{--hero:#3A2BB8;--blue:#5B3FE6;--blue-soft:#E6E0FF;--on-blue:#FFFFFF}
@media (prefers-color-scheme:dark){body[data-acct="backtest"]{--hero:#2B2378;--blue:#9B8AFF;--blue-soft:#2B2378;--on-blue:#120A3A}}
body[data-acct="backtest"] .primary{box-shadow:0 10px 24px rgba(91,63,230,.35)}
body[data-acct="backtest"] .tab.fab .bubble{box-shadow:0 8px 22px rgba(91,63,230,.45)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.bt{background:rgba(122,90,248,.16);color:var(--smc)}
.chead{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.chead b{font-size:15px}
.clearall{color:var(--blue);font-weight:600;font-size:13.5px;padding:6px 4px}
.combo{margin:8px 0 2px;padding:10px 12px;border-radius:14px;background:var(--blue-soft);font-size:13.5px}
.combo.empty-c{background:var(--surface2);color:var(--muted)}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shot{position:relative;width:92px;height:68px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px;text-align:center}
.field .addshot{width:92px;height:68px;border-radius:12px;border:1.5px dashed var(--blue);color:var(--blue);display:grid;place-items:center;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;margin:0;padding:4px}
.addshot input{display:none}
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(2,6,20,.94);display:none;align-items:center;justify-content:center;padding:14px}
.viewer.show{display:flex;animation:enter .2s}
.viewer img{max-width:100%;max-height:92vh;max-height:92dvh;border-radius:12px}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow b{font-size:14px;word-break:break-word}
.crow small{grid-column:1/-1;color:var(--muted)}

/* Analyse des performances */
.logo .cover{transform-box:view-box;transform-origin:39px 54px;animation:closebook .9s cubic-bezier(.3,.8,.3,1) .25s both}
@keyframes closebook{from{transform:scaleX(-1)}to{transform:scaleX(1)}}
.tbl{overflow-x:auto;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl thead th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface)}
.tbl tbody th{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600}
.tbl thead th:first-child{text-align:left;position:sticky;left:0;z-index:2}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl tr.none th,.tbl tr.none td{opacity:.45}
.tbl tr.low td,.tbl td.low{opacity:.55}
.tbl tr[data-hr]{cursor:pointer}
.tbl.mx td small{display:block;color:var(--muted);font-size:11px}
.lowtag{font-style:normal;font-size:10.5px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:8px;margin-left:6px;font-weight:500}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.qbox{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 12px;color:var(--muted)}
.qbox div+div{margin-top:4px}
.chip.flt{background:var(--blue-soft);color:var(--blue);font-weight:700}
.chip.flt.on-flt{background:var(--blue);color:var(--on-blue)}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kcard{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kcard b{display:block;font-size:18px;letter-spacing:-.02em}
.kcard span{font-size:11.5px;color:var(--muted)}
.chart{background:var(--surface);border-radius:20px;padding:12px 8px 6px;box-shadow:var(--shadow);margin-top:12px}
.chart svg{width:100%;height:auto;display:block}
.chart h3{margin:0 8px 6px;font-size:14.5px}
.chart .note{margin:4px 8px 8px}
.smetrics.c4{grid-template-columns:repeat(4,1fr);row-gap:12px}
.split{display:flex;width:72px;height:8px;border-radius:4px;overflow:hidden;margin-left:auto}
.split .sg{background:var(--gain)}.split .sl{background:var(--loss)}
.minput{width:90px;display:inline-block;padding:8px 10px}

const inRange = (h, s, e) => s === e ? false : s < e ? (h >= s && h < e) : (h >= s || h < e);

function sessionOf(t) {
  const hr = locate(t).hour;

    const hits = cfg.sessions.filter(x => inRange(u, x.s, x.e));

function seg(container, opts, currentVal, onPick, colorFn) {
  container.classList.add('seg');
  container.innerHTML = '<span class="thumb"></span>' + opts.map(o => `<button class="press" data-v="${esc(o.v)}">${esc(o.t)}</button>`).join('');
  const set = v => {
    const i = Math.max(0, opts.findIndex(o => o.v === v));
    container.style.setProperty('--i', i);
    container.style.setProperty('--n', opts.length);
    if (colorFn) container.style.setProperty('--thumb', colorFn(v));
    $$('button', container).forEach((b, k) => b.classList.toggle('on', k === i));
  };
  container.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.v; set(v); onPick(v);
  };
  set(currentVal);
}
function countTo(el, target) {
  const show = v => { el.innerHTML = fmtR(v, 1) + '<span>R</span>'; };
  if (reduceMotion) { show(target); return; }
  const t0 = performance.now(), dur = 650;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    show(target * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function curveSVG(curve, done) {
  if (curve.length < 2) return '<div class="empty-curve">Aucun trade terminé sur cette période.</div>';
  const W = 320, H = 132, L = 32, R = 8, T = 10, B = 24;
  const max = Math.max(...curve, 0), min = Math.min(...curve, 0), span = (max - min) || 1;
  const x = i => L + (W - L - R) * i / (curve.length - 1);
  const y = v => T + (H - T - B) * (max - v) / span;
  const pts = curve.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${x(curve.length - 1).toFixed(1)},${y(min).toFixed(1)} L${x(0).toFixed(1)},${y(min).toFixed(1)} Z`;
  const ys = [];
  [max, 0, min].forEach(v => { if (!ys.some(o => Math.abs(y(o) - y(v)) < 13)) ys.push(v); });
  const labels = ys.map(v => `<text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#fff" fill-opacity=".75">${fmtR(v, 1).replace('+', '')}</text>`).join('');
  const lastX = x(curve.length - 1), lastY = y(curve[curve.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe du résultat cumulé en R">
    <line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#fff" stroke-opacity=".35" stroke-dasharray="3 4"/>
    <path d="${area}" fill="#fff" fill-opacity=".12"/>
    <path class="ln" d="${line}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="#fff"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4.5" fill="#fff"/>
    ${labels}
    <text x="${L}" y="${H - 6}" font-size="9.5" fill="#fff" fill-opacity=".75">${fmtDate(done[0].date)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="9.5" fill="#fff" fill-opacity=".75">${fmtDate(done[done.length - 1].date)}</text>
  </svg>`;
}
function drawCurve() {
  const p = $('#curve .ln'); if (!p || reduceMotion) return;
  const len = p.getTotalLength();
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s cubic-bezier(.3,.7,.2,1)';
  p.style.strokeDashoffset = 0;
}
function spark(curve) {
  if (curve.length < 2) return '';
  const W = 120, H = 34, max = Math.max(...curve, 0), min = Math.min(...curve, 0), span = (max - min) || 1;
  const pts = curve.map((v, i) => `${(W * i / (curve.length - 1)).toFixed(1)},${(3 + (H - 6) * (max - v) / span).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${pts.join(' L')}" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function divBars(rows, d = 1) {
  const max = Math.max(...rows.map(r => Math.abs(r.v)), 0.0001);
  return rows.map(r => {
    const w = Math.abs(r.v) / max * 50, pos = r.v >= 0;
    return `<div class="brow"><div class="blab"><b>${esc(r.label)}</b><small class="muted">${esc(r.sub)}</small></div>
      <div class="btrack"><i class="zero"></i><i class="bar ${pos ? 'pos' : 'neg'}" style="width:${w}%;${pos ? 'left:50%' : 'right:50%'}"></i></div>
      <div class="bval ${signClass(r.v)}">${fmtR(r.v, d)}</div></div>`;
  }).join('');
}
function tradeRow(t) {

function shrinkImage(file) {
  return new Promise(res => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => res(null);
      img.src = rd.result;
    };
    rd.onerror = () => res(null);
    rd.readAsDataURL(file);
  });
}
async function addShots(files) {

    const src = await shrinkImage(f);
    if (src) draft.shots.push(src); else toast('Image illisible');
  }
  paintShots();
}

function rmMsg(f) { const m = f.querySelector('.msg'); if (m) m.remove(); }
function fieldError(id, msg) {
  const el = $('#' + id), f = el.closest('.field');
  f.classList.add('bad'); rmMsg(f);
  const m = document.createElement('div'); m.className = 'msg'; m.textContent = msg; f.appendChild(m);
  f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  el.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
}
function clearErrors() { $$('#s-new .field.bad').forEach(f => { f.classList.remove('bad', 'shake'); rmMsg(f); }); }
function saveTrade() {
  const d = draft; clearErrors();
  if (!d.date) { fieldError('f-date', 'Choisis une date.'); return; }
  let r = null;
  if (['Gain', 'Perte', 'BE'].includes(d.result)) {
    let v = parseNum(d.r);
    if (d.result === 'BE' && String(d.r).trim() === '') v = 0;
    if (v == null) { fieldError('f-r', 'Indique le résultat en R, par exemple 2,5.'); return; }
    if (d.result !== 'BE' && v === 0) { fieldError('f-r', 'Un gain ou une perte ne peut pas valoir 0 R. Choisis Break-even.'); return; }
    r = d.result === 'Gain' ? Math.abs(v) : d.result === 'Perte' ? -Math.abs(v) : v;
  }
  let risk = null;
  if (String(d.risk).trim() !== '') {
    risk = parseNum(d.risk);
    if (risk == null || risk <= 0 || risk > 100) { fieldError('f-risk', 'Entre un risque entre 0 et 100 %.'); return; }
  }
  const t = { id: editingId != null ? editingId : nextId++, acct: d.acct, shots: d.shots, btPeriod: (d.btPeriod || '').trim(), date: d.date, time: d.time || '', tz: d.time ? ((editingId != null && typeof d.tz === 'number') ? d.tz : cfg.inputTz * 60) : null, asset: d.asset, session: d.session, strat: d.strat, dir: d.dir, result: d.result, r, risk,
    setup: d.setup, concepts: [...d.concepts], plan: d.plan, full: d.full, tfEntry: d.tfEntry, tfHigh: d.tfHigh, macro: d.macro, dxy: d.dxy,
    yields: d.yields, news: d.news, newsRes: d.newsRes, mistake: d.mistake, note: d.note.trim() };
  if (editingId != null) { const i = trades.findIndex(x => x.id === editingId); trades[i] = t; }
  else trades.push(t);
  toast(editingId != null ? 'Modifications enregistrées' : 'Trade enregistré');
  editingId = null; draft = newDraft(d.strat);
  period = 'Tout'; go('home');
}

/* ---------- Analyse ---------- */
/* ---------- Analyse des performances ---------- */
const fmtWR = v => v == null ? '—' : Math.round(v) + ' %';
const fmtRN = (v, d = 1) => v == null ? 'N/A' : fmtR(v, d) + ' R';
const fmtExp = v => v == null ? '—' : fmtR(v, 2) + ' R';
const fmtDD = v => v == null ? '—' : (v > 0 ? '−' : '') + fmtNum(v.toFixed(1)) + ' R';
const fmtLoss = v => v > 0 ? '−' + fmtNum(v.toFixed(1)) : '0,0';
const VIEWS = [['sum', 'Résumé'], ['hours', 'Heures'], ['sess', 'Sessions'], ['days', 'Jours'], ['meth', 'Méthodes'], ['asset', 'Actifs'], ['cond', 'Conditions'], ['conc', 'Concepts']];
const activeFilters = () => ['period', 'asset', 'session', 'hour', 'dow', 'result'].filter(k => F[k] !== defaultFilters()[k]).length;
const sortDesc = list => list.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

function barChart(items, o = {}) {
  const signed = o.signed !== false;
  const vals = items.map(i => i.v).filter(v => v != null && Number.isFinite(v));
  if (!vals.length) return '<p class="note">Pas encore de données pour ce graphique.</p>';
  const W = 340, H = 170, L = 40, R = 8, T = 12, B = 26;
  let max = Math.max(...vals, 0); const min = signed ? Math.min(...vals, 0) : 0;
  if (o.max != null) max = o.max;
  if (max === min) max = min + 1;
  const y = v => T + (H - T - B) * (max - v) / (max - min);
  const bw = (W - L - R) / items.length, y0 = y(0), fmt = o.fmt || String;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Graphique')}">`;
  const ticks = [];
  [max, 0, min].forEach(v => { if (!ticks.some(t => Math.abs(y(t) - y(v)) < 14)) ticks.push(v); });
  ticks.forEach(v => { out += `<text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9.5" style="fill:var(--muted)">${esc(fmt(v))}</text>`; });
  out += `<line x1="${L}" x2="${W - R}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" style="stroke:var(--line)" stroke-width="1.5"/>`;
  const step = items.length > 12 ? 3 : 1;
  items.forEach((it, i) => {
    const x = L + i * bw, bx = x + bw * 0.16, w = bw * 0.68;
    if (it.v != null && Number.isFinite(it.v)) {
      const y1 = y(it.v), top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y1 - y0));
      const col = signed ? (it.v >= 0 ? 'var(--gain)' : 'var(--loss)') : 'var(--blue)';
      out += `<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" style="fill:${col};${it.low ? 'opacity:.4' : ''}"/>`;
    }
    if (i % step === 0) out += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">${esc(it.label)}</text>`;
    if (it.attr) out += `<rect ${it.attr} x="${x.toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H - T - B}" style="fill:transparent;cursor:pointer"/>`;
  });
  return out + '</svg>';
}
function lineChart(vals, o = {}) {
  if (vals.length < 2) return '<p class="note">Pas encore assez de trades terminés pour tracer une courbe.</p>';
  const W = 340, H = 150, L = 40, R = 10, T = 10, B = 22;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1;
  const x = i => L + (W - L - R) * i / (vals.length - 1);
  const y = v => T + (H - T - B) * (max - v) / span;
  const line = 'M' + vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L');
  const area = `${line} L${x(vals.length - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const col = o.color || 'var(--blue)';
  const ticks = [];
  [max, 0, min].forEach(v => { if (!ticks.some(t => Math.abs(y(t) - y(v)) < 14)) ticks.push(v); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Courbe')}">
    ${ticks.map(v => `<text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9.5" style="fill:var(--muted)">${fmtR(v, 1).replace('+', '')}</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" style="stroke:var(--line)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="${area}" style="fill:${col};opacity:.14"/>
    <path d="${line}" fill="none" style="stroke:${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${L}" y="${H - 6}" font-size="9.5" style="fill:var(--muted)">${o.first || ''}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="9.5" style="fill:var(--muted)">${o.last || ''}</text></svg>`;
}
function statRow(label, s, attrs, minN) {
  const low = s.n > 0 && s.n < minN;
  return `<tr ${attrs || ''} class="${s.n ? '' : 'none'} ${low ? 'low' : ''}"><th>${label}${low ? '<i class="lowtag">peu</i>' : ''}</th><td>${s.n}</td><td class="g">${s.wins}</td><td class="l">${s.losses}</td><td>${s.be}</td><td>${fmtWR(s.winRate)}</td>
    <td class="g">${s.n ? fmtR(s.grossWin, 1) : '—'}</td><td class="l">${s.n ? fmtLoss(s.grossLoss) : '—'}</td><td class="${signClass(s.n ? s.total : null)}"><b>${s.n ? fmtR(s.total, 1) : '—'}</b></td>
    <td>${s.n ? fmtRN(s.avgWin, 2).replace(' R', '') : '—'}</td><td class="${signClass(s.expectancy)}">${s.n ? fmtR(s.expectancy, 2) : '—'}</td><td>${s.n ? fmtPF(s.pf) : '—'}</td></tr>`;
}
const STAT_HEAD = ['Trades', 'G', 'P', 'BE', 'Réussite', 'Gains bruts', 'Pertes brutes', 'Net', 'Gain moy.', 'Espérance', 'PF'];
const statTable = (first, rows) => `<div class="tbl"><table><thead><tr><th>${first}</th>${STAT_HEAD.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Résultats en R. G = gagnants, P = perdants, BE = break-even (compté dans les trades terminés, ni gain ni perte). ∞ = aucune perte, profit factor non défini. Lignes marquées « peu » : moins de ${cfg.minTrades} trades.</p>`;

function qualityHTML(scope) {
  const L = [];
  const noTime = scope.filter(t => isDone(t) && !hasTime(t)).length;
  const open = scope.filter(t => t.result === 'En attente').length;
  const canc = scope.filter(t => t.result === 'Annulé').length;
  const noR = scope.filter(t => ['Gain', 'Perte', 'BE'].includes(t.result) && typeof t.r !== 'number').length;
  const noDate = scope.filter(t => !validDate(t)).length;
  if (noTime) L.push(`${noTime} trade${noTime > 1 ? 's' : ''} terminé${noTime > 1 ? 's' : ''} sans heure : exclu${noTime > 1 ? 's' : ''} de l’analyse par heure. La session choisie à la main est utilisée à la place.`);
  if (open) L.push(`${open} trade${open > 1 ? 's' : ''} en attente : exclu${open > 1 ? 's' : ''} de toutes les statistiques.`);
  if (canc) L.push(`${canc} trade${canc > 1 ? 's' : ''} annulé${canc > 1 ? 's' : ''} : exclu${canc > 1 ? 's' : ''} des statistiques.`);
  if (noR) L.push(`${noR} trade${noR > 1 ? 's' : ''} terminé${noR > 1 ? 's' : ''} sans résultat en R : exclu${noR > 1 ? 's' : ''}, jamais compté${noR > 1 ? 's' : ''} comme 0 R.`);
  if (noDate) L.push(`${noDate} trade${noDate > 1 ? 's' : ''} sans date exploitable : exclu${noDate > 1 ? 's' : ''} des analyses par jour et par heure.`);
  return L.length ? `<div class="qbox">${L.map(x => `<div>${x}</div>`).join('')}</div>` : '';
}

/* --- Résumé --- */
function summaryHTML(scope) {
  const a = calc(scope), C = 2 * Math.PI * 42, off = C * (1 - a.winRate / 100);
  const kp = [
    ['Trades terminés', a.n, ''], ['Réussite', fmtWR(a.winRate), ''], ['Résultat net', fmtRN(a.total), signClass(a.total)],
    ['Profit factor', fmtPF(a.pf), ''], ['Espérance', fmtExp(a.expectancy), signClass(a.expectancy)], ['Drawdown max', fmtDD(a.dd), a.dd > 0 ? 'l' : ''],
    ['Gain moyen', fmtRN(a.avgWin, 2), a.avgWin == null ? '' : 'g'], ['Perte moyenne', fmtRN(a.avgLoss, 2), a.avgLoss == null ? '' : 'l'],
    ['Meilleur trade', fmtRN(a.best), signClass(a.best)], ['Pire trade', fmtRN(a.worst), signClass(a.worst)],
    ['Série de gains max', a.maxWS, ''], ['Série de pertes max', a.maxLS, '']
  ];
  const first = a.done.length ? fmtDate(a.done[0].date) : '', last = a.done.length ? fmtDate(a.done[a.done.length - 1].date) : '';
  const side = ['BUY', 'SELL'].map(d => ({ d, s: calc(scope.filter(t => t.dir === d)) }));
  const plan = [[true, 'Plan respecté'], [false, 'Plan non respecté']].map(([p, label]) => ({ label, s: calc(scope.filter(t => t.plan === p)) })).filter(x => x.s.n);
  const showList = F.strat !== 'Tous' || activeFilters() > 0;
  return `<div class="kgrid">${kp.map(([l, v, c]) => `<div class="kcard"><b class="${c}">${v}</b><span>${l}</span></div>`).join('')}</div>
    <p class="note">Réussite = gagnants ÷ trades terminés (gain, perte, break-even). Profit factor = gains ÷ pertes. Tout est en R.</p>
    <div class="chart"><h3>Évolution du capital, en R cumulés</h3>${lineChart(a.curve, { first, last, label: 'Résultat cumulé en R' })}
      <p class="note">Capital initial inconnu : la courbe montre la variation cumulée en R, dans l’ordre chronologique des trades terminés.</p></div>
    <div class="chart"><h3>Drawdown, en R</h3>${lineChart(a.ddCurve, { color: 'var(--loss)', first, last, label: 'Drawdown en R' })}
      <p class="note">Baisse par rapport au dernier sommet, calculée sur les clôtures uniquement (pas à l’intérieur des trades).</p></div>
    <h2>Réussite</h2><section class="card"><div class="ringwrap">
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle class="arc" id="arc" cx="50" cy="50" r="42" fill="none" stroke="var(--blue)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/></svg>
        <b>${Math.round(a.winRate)} %</b></div>
      <div class="counts"><div><i style="background:var(--gain)"></i>${a.wins} gagnants</div><div><i style="background:var(--loss)"></i>${a.losses} perdants</div>
        <div><i style="background:var(--flat)"></i>${a.be} break-even</div></div></div></section>
    <h2>BUY et SELL</h2><div class="vs">${side.map(({ d, s }) => `<div class="card"><small class="muted">${d}</small>
      <b class="${signClass(s.n ? s.total : null)}">${s.n ? fmtR(s.total, 1) + ' R' : '—'}</b><small class="muted">${s.n ? s.n + ' trades, ' + Math.round(s.winRate) + ' % de réussite' : 'Aucun trade terminé'}</small></div>`).join('')}</div>
    <h2>Discipline</h2><section class="card">${plan.length ? divBars(plan.map(x => ({ label: x.label, sub: x.s.n + ' trades', v: x.s.expectancy })), 2) : '<small class="muted">Pas assez de données.</small>'}
      <p class="note" style="margin:10px 0 0">Espérance en R par trade terminé.</p></section>
    ${showList ? `<h2>Trades correspondants (${scope.length})</h2>${sortDesc(scope).slice(0, 40).map(tradeRow).join('')}${scope.length > 40 ? '<p class="note">Les 40 plus récents sont affichés. Utilise l’historique pour voir les autres.</p>' : ''}` : ''}
    <p class="note">Ces chiffres décrivent tes trades passés. Ils ne prédisent pas les résultats à venir, et une corrélation ne prouve pas une cause.</p>`;
}

/* --- Heures --- */
function hoursHTML(scope) {
  const modes = [['1', '1 h'], ['2', '2 h'], ['3', '3 h'], ['4', '4 h'], ['6', '6 h'], ['8', '8 h'], ['12', '12 h'], ['custom', 'Personnalisé']];
  return `<div class="chips scroll">${modes.map(([v, t]) => `<button class="chip press ${cfg.bandMode === v ? 'on' : ''}" data-band="${v}">${t}</button>`).join('')}</div>
    ${cfg.bandMode === 'custom' ? `<div class="field" style="margin:4px 0 10px"><label>Heures de début des tranches, séparées par des virgules</label><input data-bandcustom value="${esc(cfg.bandCustom)}" placeholder="0, 8, 13, 22"></div>` : ''}
    <p class="note" style="margin:0 2px 10px">Heures affichées en ${tzName(cfg.viewTz)}. <button class="link" data-go="settings">Changer le fuseau</button></p>
    <div id="hRes">${hoursResults(scope)}</div>`;
}
function hoursResults(scope) {
  const bands = bandsList(), hourly = bands.every(b => b.e - b.s === 1);
  const rows = bands.map(b => {
    const l = scope.filter(t => { const hr = locate(t).hour; return hr != null && inBand(hr, b); });
    return { b, s: calc(l) };
  });
  const short = b => hourly ? pad(b.s) : `${pad(b.s)}–${pad(b.e % 24)}`;
  const mk = f => rows.map(r => ({ label: short(r.b), v: r.s.n ? f(r.s) : null, low: r.s.n > 0 && r.s.n < cfg.minTrades, attr: `data-hr="${r.b.s}-${r.b.e}"` }));
  const ok = rows.filter(r => r.s.n >= cfg.minTrades);
  const best = ok.filter(r => r.s.total > 0).sort((a, b) => b.s.total - a.s.total).slice(0, 3);
  const worst = ok.filter(r => r.s.total < 0).sort((a, b) => a.s.total - b.s.total).slice(0, 3);
  const li = r => `<div class="cardrow" style="padding:6px 0"><span><b>${r.b.label}</b> <small class="muted">${r.s.n} trades, ${fmtWR(r.s.winRate)}</small></span><b class="${signClass(r.s.total)}">${fmtR(r.s.total, 1)} R</b></div>`;
  const known = scope.filter(t => isDone(t) && locate(t).hour != null).length;
  const invalid = cfg.bandMode === 'custom' && !customBounds() ? '<p class="note">Saisie incomplète : affichage heure par heure. Indique au moins 2 heures entre 0 et 23.</p>' : '';
  return `${invalid}<p class="note" style="margin:0 2px 8px">${known} trades terminés avec une heure connue.</p>
    <div class="chart"><h3>Résultat net par ${hourly ? 'heure' : 'tranche'}, en R</h3>${barChart(mk(s => s.total), { signed: true, fmt: v => fmtR(v, 1).replace('+', ''), label: 'Résultat net par heure' })}
      <p class="note">Barres claires : moins de ${cfg.minTrades} trades. Touche une barre pour voir les trades.</p></div>
    <div class="chart"><h3>Taux de réussite par ${hourly ? 'heure' : 'tranche'}</h3>${barChart(mk(s => s.winRate), { signed: false, max: 100, fmt: v => Math.round(v) + '%', label: 'Taux de réussite par heure' })}
      <p class="note">Une ${hourly ? 'heure' : 'tranche'} sans trade n’a pas de barre : aucun taux n’est inventé.</p></div>
    <h2>À étudier de plus près</h2><section class="card">
      ${ok.length ? `<b class="g">Les plus rentables</b>${best.length ? best.map(li).join('') : '<p class="note" style="margin:4px 0">Aucune avec un résultat positif.</p>'}
        <div style="height:10px"></div><b class="l">Les plus pénalisantes</b>${worst.length ? worst.map(li).join('') : '<p class="note" style="margin:4px 0">Aucune avec un résultat négatif.</p>'}`
        : `<p class="note" style="margin:0">Pas encore assez de trades par ${hourly ? 'heure' : 'tranche'} : il en faut au moins ${cfg.minTrades} (réglable dans Paramètres).</p>`}
      <p class="note" style="margin:10px 0 0">Ce sont des pistes à vérifier, pas des conclusions.</p></section>
    <h2>Tableau détaillé</h2>${statTable(hourly ? 'Heure' : 'Tranche', rows.map(r => statRow(r.b.label, r.s, `data-hr="${r.b.s}-${r.b.e}"`, cfg.minTrades)).join(''))}`;
}
function openBandSheet(code) {
  const [s, e] = code.split('-').map(Number), b = { s, e };
  const label = e - s === 1 ? `${pad(s)} h` : `${pad(s)} h–${pad(e % 24)} h`;
  const list = applyFilters(mine(), F).filter(t => { const hr = locate(t).hour; return hr != null && inBand(hr, b); });
  const a = calc(list);
  openSheet(`<div class="grab"></div><h2 style="margin-top:4px">${label}, ${tzName(cfg.viewTz)}</h2>
    <div class="smetrics c4"><div><b>${a.n}</b><span>trades</span></div><div><b>${fmtWR(a.winRate)}</b><span>réussite</span></div><div><b class="${signClass(a.n ? a.total : null)}">${a.n ? fmtR(a.total, 1) : '—'}</b><span>net, R</span></div><div><b>${a.n ? fmtPF(a.pf) : '—'}</b><span>PF</span></div></div>
    <div style="margin-top:14px">${list.length ? sortDesc(list).map(tradeRow).join('') : '<p class="muted">Aucun trade sur cette tranche.</p>'}</div>`);
}

/* --- Sessions --- */
function sessionsHTML(scope) {
  const data = sessionNames().map(n => ({ n, s: calc(scope.filter(t => sessionOf(t) === n)) }));
  const chart = barChart(data.map(d => ({ label: d.n === OTHER ? 'Autre' : d.n, v: d.s.n ? d.s.total : null, low: d.s.n > 0 && d.s.n < cfg.minTrades })), { signed: true, fmt: v => fmtR(v, 1).replace('+', ''), label: 'Résultat net par session' });
  const hrs = cfg.sessions.map(x => `${x.name} ${pad(toView(x.s))} h–${pad(toView(x.e))} h`).join(', ');
  const cards = data.map(({ n, s }) => {
    if (!s.n) return `<div class="sblock" style="--c:var(--line)"><div class="shead"><span class="sname" style="color:var(--ink)">${esc(n)}</span></div><small class="muted">Aucun trade terminé avec ces filtres.</small></div>`;
    const m = [['Trades', s.n], ['Réussite', fmtWR(s.winRate)], ['PF', fmtPF(s.pf)], ['Espérance', fmtExp(s.expectancy)], ['Gain moy.', fmtRN(s.avgWin, 2)], ['Perte moy.', fmtRN(s.avgLoss, 2)], ['Meilleur', fmtRN(s.best)], ['Pire', fmtRN(s.worst)]];
    return `<div class="sblock" style="--c:var(--blue)"><div class="shead"><span class="sname" style="color:var(--ink)">${esc(n)}${s.n < cfg.minTrades ? '<i class="lowtag">échantillon faible</i>' : ''}</span><span class="rbadge ${s.total > 0 ? 'gain' : s.total < 0 ? 'loss' : 'flat'}">${fmtR(s.total, 1)} R</span></div>
      <div class="smetrics c4" style="margin-top:12px">${m.map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>`;

  return `<div class="chart"><h3>Résultat net par session, en R</h3>${chart}</div>

}

/* --- Jours --- */
function daysHTML(scope) {
  const by = {};
  scope.filter(isDone).forEach(t => { const d = locate(t).dow; if (d == null) return; (by[d] = by[d] || []).push(t); });
  const order = DOW_ORDER.filter(d => (d >= 1 && d <= 5) || (by[d] || []).length);
  const rows = order.map(d => ({ d, s: calc(by[d] || []) }));
  const chart = barChart(rows.map(r => ({ label: DOW_SHORT[r.d], v: r.s.n ? r.s.total : null, low: r.s.n > 0 && r.s.n < cfg.minTrades })), { signed: true, fmt: v => fmtR(v, 1).replace('+', ''), label: 'Résultat net par jour' });
  const tr = rows.map(({ d, s }) => `<tr class="${s.n ? '' : 'none'} ${s.n > 0 && s.n < cfg.minTrades ? 'low' : ''}"><th>${DOW[d]}${s.n > 0 && s.n < cfg.minTrades ? '<i class="lowtag">peu</i>' : ''}</th><td>${s.n}</td><td><span class="g">${s.wins}</span> / <span class="l">${s.losses}</span> / ${s.be}</td><td>${fmtWR(s.winRate)}</td><td class="${signClass(s.n ? s.total : null)}"><b>${s.n ? fmtR(s.total, 1) : '—'}</b></td><td>${s.n ? fmtPF(s.pf) : '—'}</td><td class="${signClass(s.expectancy)}">${s.n ? fmtR(s.expectancy, 2) : '—'}</td></tr>`).join('');
  return `<div class="chart"><h3>Résultat net par jour, en R</h3>${chart}</div>
    <h2>Tableau par jour</h2><div class="tbl"><table><thead><tr><th>Jour</th><th>Trades</th><th>G / P / BE</th><th>Réussite</th><th>Net</th><th>PF</th><th>Espérance</th></tr></thead><tbody>${tr}</tbody></table></div>
    <p class="note">Jours calculés dans le fuseau ${tzName(cfg.viewTz)}. Le samedi et le dimanche apparaissent seulement s’il y a des trades.</p>`;
}

/* --- Méthodes et actifs --- */
const indChips = () => `<div class="chips scroll">${Object.entries(INDS).map(([k, v]) => `<button class="chip press ${aInd === k ? 'on' : ''}" data-ind="${k}">${v.t}</button>`).join('')}</div>`;
function matrixHTML(scope, dimKey) {
  const dim = DIMS[dimKey], ind = INDS[aInd], vals = {};
  scope.filter(isDone).forEach(t => { const v = dim.val(t); if (v == null) return; (vals[v] = vals[v] || []).push(t); });
  const order = dimKey === 'session' ? sessionNames() : dimKey === 'dow' ? DOW_ORDER.map(d => DOW[d]) : dimKey === 'hour' ? bandsList().map(b => b.label) : null;
  const keys = order ? order.filter(k => vals[k]) : Object.keys(vals).sort((a, b) => vals[b].length - vals[a].length);
  if (!keys.length) return '<p class="note">Aucune donnée pour ce croisement.</p>';
  const sk = Object.keys(STRATS);
  return `<div class="tbl mx"><table><thead><tr><th>${dim.label}</th>${sk.map(k => `<th>${STRATS[k].label}</th>`).join('')}</tr></thead><tbody>${keys.map(k => `<tr><th>${esc(k)}</th>${sk.map(sc => {
    const s = calc(vals[k].filter(t => t.strat === sc));
    return `<td class="${s.n && s.n < cfg.minTrades ? 'low' : ''}">${cellOf(ind, s)}<small>${s.n} trade${s.n > 1 ? 's' : ''}</small></td>`;
  }).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note">Indicateur : ${ind.t}. Les cases claires comptent moins de ${cfg.minTrades} trades : échantillon trop faible pour conclure.</p>`;
}
function methodsHTML(scope) {
  const ind = INDS[aInd];
  const data = Object.keys(STRATS).map(k => ({ k, s: calc(scope.filter(t => t.strat === k)) }));
  const chart = barChart(data.map(d => { const v = d.s.n ? ind.val(d.s) : null; return { label: STRATS[d.k].label, v: v === Infinity ? null : v, low: d.s.n > 0 && d.s.n < cfg.minTrades }; }),
    { signed: ind.signed, max: ind.max, fmt: v => ind.fmt(v).replace('+', ''), label: 'Comparaison des méthodes' });
  const cards = data.map(({ k, s }) => {
    const st = STRATS[k];
    if (!s.n) return `<div class="sblock" style="--c:${st.color}"><div class="shead"><span class="sname">${st.label}</span></div><small class="muted">Aucun trade terminé avec ces filtres.</small></div>`;
    const m = [['Trades', s.n], ['Réussite', fmtWR(s.winRate)], ['Net', fmtRN(s.total)], ['PF', fmtPF(s.pf)], ['Espérance', fmtExp(s.expectancy)], ['Gains bruts', fmtR(s.grossWin, 1)], ['Pertes brutes', fmtLoss(s.grossLoss)], ['Gain moy.', fmtRN(s.avgWin, 2)], ['Perte moy.', fmtRN(s.avgLoss, 2)], ['Série gains', s.maxWS], ['Série pertes', s.maxLS], ['Drawdown', fmtDD(s.dd)]];
    return `<div class="sblock" style="--c:${st.color}"><div class="shead"><span class="sname">${st.label}${s.n < cfg.minTrades ? '<i class="lowtag">échantillon faible</i>' : ''}</span></div>${spark(s.curve)}
      <div class="smetrics c4">${m.map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>`;
  }).join('');
  const dims = [['hour', 'Heures'], ['session', 'Sessions'], ['dow', 'Jours'], ['asset', 'Actifs']];
  return `${indChips()}<div class="chart" style="margin-top:4px"><h3>Comparaison : ${ind.t}</h3>${chart}</div>
    <h2>Détail par méthode</h2>${cards}
    <h2>Méthodes selon…</h2><div class="chips scroll">${dims.map(([v, t]) => `<button class="chip press ${mDim === v ? 'on' : ''}" data-mdim="${v}">${t}</button>`).join('')}</div>
    ${matrixHTML(scope, mDim)}
    <p class="note">Pour répondre à une question précise (par exemple quelle méthode sur XAUUSD à Londres), choisis l’actif et la session dans Filtres. Aucune méthode n’est déclarée meilleure sur un petit échantillon.</p>`;
}
function assetsHTML(scope) {
  const by = {};
  scope.filter(isDone).forEach(t => { (by[t.asset] = by[t.asset] || []).push(t); });
  const rows = Object.keys(by).map(a => ({ a, s: calc(by[a]) })).sort((x, y) => y.s.n - x.s.n);
  const tr = rows.map(({ a, s }) => {
    const tot = s.grossWin + s.grossLoss, pct = tot ? s.grossWin / tot * 100 : 0, low = s.n < cfg.minTrades;
    return `<tr class="${low ? 'low' : ''}"><th>${esc(a)}${low ? '<i class="lowtag">peu</i>' : ''}</th><td>${s.n}</td><td>${fmtWR(s.winRate)}</td><td class="${signClass(s.total)}"><b>${fmtR(s.total, 1)}</b></td><td>${fmtPF(s.pf)}</td><td class="${signClass(s.expectancy)}">${fmtR(s.expectancy, 2)}</td><td class="g">${fmtR(s.best, 1)}</td><td class="l">${fmtR(s.worst, 1)}</td><td>${tot ? `<span class="split"><i class="sg" style="width:${pct.toFixed(0)}%"></i><i class="sl" style="width:${(100 - pct).toFixed(0)}%"></i></span>` : '—'}</td></tr>`;
  }).join('');
  return `<h2 style="margin-top:4px">Performance par actif</h2><div class="tbl"><table><thead><tr><th>Actif</th><th>Trades</th><th>Réussite</th><th>Net</th><th>PF</th><th>Espérance</th><th>Meilleur</th><th>Pire</th><th>Gains / pertes</th></tr></thead><tbody>${tr}</tbody></table></div>
    <p class="note">Résultats en R. Dernière colonne : part des gains bruts (vert) et des pertes brutes (rouge). Les actifs apparaissent dès qu’un trade est enregistré ; tu peux en ajouter dans Paramètres.</p>
    <h2>Actifs selon la méthode</h2>${indChips()}${matrixHTML(scope, 'asset')}`;
}

/* --- Conditions de rentabilité --- */
function condHTML(scope) {
  const dims = Object.entries(DIMS);
  return `<p class="note" style="margin:0 2px 8px">Choisis les critères à croiser, par exemple Méthode + Actif + Session.</p>
    <div class="chips scroll">${dims.map(([k, d]) => `<button class="chip press ${xDims.includes(k) ? 'on' : ''}" data-xd="${k}">${d.label}</button>`).join('')}</div>
    <div class="chips scroll">${[['net', 'Résultat net'], ['pf', 'Profit factor'], ['exp', 'Espérance']].map(([k, t]) => `<button class="chip press ${xSort === k ? 'on' : ''}" data-xs="${k}">Classer par ${t.toLowerCase()}</button>`).join('')}</div>
    <div class="field" style="margin:4px 0 12px"><label>Nombre minimal de trades pour figurer au classement</label><input class="minput" type="number" min="1" inputmode="numeric" data-xmin value="${xMin != null ? xMin : cfg.minTrades}"></div>
    <div id="xRes">${condResults(scope)}</div>`;
}
function condResults(scope) {
  if (!xDims.length) return '<p class="note">Sélectionne au moins un critère.</p>';
  const min = xMin != null ? xMin : cfg.minTrades;
  const { groups, excluded } = crossGroups(scope.filter(isDone), xDims);
  const rows = Object.entries(groups).map(([k, l]) => ({ k, s: calc(l) }));
  const metric = r => xSort === 'net' ? r.s.total : xSort === 'pf' ? (r.s.pf === Infinity ? 1e9 : (r.s.pf != null ? r.s.pf : -1)) : r.s.expectancy;
  const ok = rows.filter(r => r.s.n >= min).sort((a, b) => metric(b) - metric(a)).slice(0, 15);
  const weak = rows.filter(r => r.s.n < min).sort((a, b) => b.s.n - a.s.n).slice(0, 10);
  const tbl = (list, flag) => `<div class="tbl"><table><thead><tr><th>Conditions</th><th>Trades</th><th>Réussite</th><th>Net</th><th>PF</th><th>Espérance</th></tr></thead><tbody>${list.map(r => `<tr class="${flag ? 'low' : ''}"><th>${esc(r.k)}${flag ? '<i class="lowtag">insuffisant</i>' : ''}</th><td>${r.s.n}</td><td>${fmtWR(r.s.winRate)}</td><td class="${signClass(r.s.total)}"><b>${fmtR(r.s.total, 1)}</b></td><td>${fmtPF(r.s.pf)}</td><td class="${signClass(r.s.expectancy)}">${fmtR(r.s.expectancy, 2)}</td></tr>`).join('')}</tbody></table></div>`;
  return `${excluded ? `<p class="note" style="margin:0 2px 8px">${excluded} trade${excluded > 1 ? 's' : ''} exclu${excluded > 1 ? 's' : ''} : une des informations croisées est inconnue (par exemple l’heure).</p>` : ''}
    <h2 style="margin-top:8px">Classement (au moins ${min} trades)</h2>${ok.length ? tbl(ok, false) : `<div class="card"><small class="muted">Aucune combinaison n’atteint ${min} trades pour l’instant. Baisse le minimum ou enregistre plus de trades.</small></div>`}
    <h2>Insuffisamment documentées (moins de ${min} trades)</h2>${weak.length ? tbl(weak, true) : '<div class="card"><small class="muted">Aucune.</small></div>'}
    <p class="note">Une combinaison observée n’est pas une cause, et ne garantit rien pour la suite. Avec peu de trades, ces classements changent beaucoup.</p>`;
}

/* --- Concepts (combinaisons cochées dans les trades) --- */
function conceptStatsHTML(scope) {
  const byKey = (list, keyFn) => { const m = {}; list.forEach(t => keyFn(t).forEach(k => { (m[k] = m[k] || []).push(t); })); return m; };
  const rank = m => Object.entries(m).map(([k, l]) => ({ k, s: calc(l) })).filter(x => x.s.n >= 2).sort((x, y) => y.s.total - x.s.total).slice(0, 10);
  const crow = x => `<div class="crow"><b>${esc(x.k)}</b><span class="bval ${signClass(x.s.total)}">${fmtR(x.s.total, 1)} R</span><small>${x.s.n} trades, ${Math.round(x.s.winRate)} % de réussite, espérance ${fmtR(x.s.expectancy, 2)} R</small></div>`;
  const keys = F.strat === 'Tous' ? Object.keys(STRATS) : [F.strat];
  const parts = keys.map(k => {
    const st = STRATS[k], done = calc(scope.filter(t => t.strat === k)).done;
    const combos = rank(byKey(done.filter(t => (t.concepts || []).length >= 2), t => [[...t.concepts].sort().join(' + ')]));
    const concs = rank(byKey(done, t => t.concepts || []));
    return `<h2 style="color:${st.color}">${st.label}</h2>
      <section class="card"><b>Combinaisons</b>${combos.length ? combos.map(crow).join('') : `<p class="note" style="margin:8px 0 0">Une combinaison apparaît ici dès qu’elle compte au moins 2 trades terminés.</p>`}</section>
      <section class="card" style="margin-top:10px"><b>Concepts seuls</b>${concs.length ? concs.map(crow).join('') : `<p class="note" style="margin:8px 0 0">Un concept apparaît ici dès qu’il compte au moins 2 trades terminés.</p>`}</section>`;
  }).join('');
  return parts + `<p class="note">Chaque méthode est analysée séparément : un concept qui porte le même nom dans deux méthodes (par exemple Order Block) n’est jamais mélangé. Avec peu de trades, ces classements bougent beaucoup.</p>`;
}

/* --- Écran Analyse --- */
function renderStats() {
  $('#s-stats').innerHTML = `<h1>Analyse</h1>
    <div class="chips scroll" id="aTop"></div>
    <div class="chips scroll" id="aViews" style="margin-bottom:12px"></div>
    <div id="aBody"></div>`;
  paintStats();
}
function paintTop() {
  const keep = ($('#aViews') || {}).scrollLeft || 0, n = activeFilters();
  $('#aTop').innerHTML = [['Tous', 'Toutes'], ['ICT', 'ICT'], ['SMC', 'SMC'], ['PA', 'Price Action']]
    .map(([v, t]) => `<button class="chip press ${F.strat === v ? 'on' : ''}" data-fq="${v}">${t}</button>`).join('') +
    `<button class="chip press flt ${n ? 'on-flt' : ''}" data-act="open-filters">Filtres${n ? ' (' + n + ')' : ''}</button>`;
  $('#aViews').innerHTML = VIEWS.map(([v, t]) => `<button class="chip press ${aView === v ? 'on' : ''}" data-av="${v}">${t}</button>`).join('');
  $('#aViews').scrollLeft = keep;
}
function paintStats() {
  if (current !== 'stats') return;
  paintTop();
  const all = mine(), allDone = all.filter(isDone), body = $('#aBody');
  if (!allDone.length) {
    body.innerHTML = `<div class="card empty"><b>Pas encore de trade terminé</b><p>Les statistiques apparaissent dès qu’un trade a un résultat.</p><button class="primary press" data-go="new">Enregistrer un trade</button></div>`;
    return;
  }
  const scope = applyFilters(all, F), nDone = scope.filter(isDone).length;
  let html = (activeFilters() > 0 || F.strat !== 'Tous') ? `<div class="fbar"><span>${nDone} trades terminés sur ${allDone.length}</span><button class="link" data-act="reset-filters">Réinitialiser les filtres</button></div>` : '';
  html += qualityHTML(scope);
  if (!nDone) html += `<div class="card empty"><b>Aucun trade terminé avec ces filtres</b><p>Change ou réinitialise les filtres pour voir des statistiques.</p></div>`;
  else html += ({ sum: summaryHTML, hours: hoursHTML, sess: sessionsHTML, days: daysHTML, meth: methodsHTML, asset: assetsHTML, cond: condHTML, conc: conceptStatsHTML })[aView](scope);
  body.innerHTML = html;
  const arc = $('#arc');
  if (arc) requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = arc.dataset.off; }));
}
function openFilters() {
  const assets = [...new Set(mine().map(t => t.asset))].sort();

  const sel = (key, label, opts) => `<div class="field"><label>${label}</label><select data-ff="${key}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(F[key]) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  openSheet(`<div class="grab"></div><div class="cardrow"><h2 style="margin:0">Filtres</h2><button class="link" data-act="reset-filters">Réinitialiser</button></div>
    ${sel('period', 'Période', [['all', 'Toute la période'], ['today', 'Aujourd’hui'], ['7d', '7 derniers jours'], ['30d', '30 derniers jours'], ['month', 'Mois en cours'], ['year', 'Année en cours'], ['custom', 'Période personnalisée']])}
    ${F.period === 'custom' ? `<div class="two"><div class="field"><label>Du</label><input type="date" data-ff="from" value="${esc(F.from)}"></div><div class="field"><label>Au</label><input type="date" data-ff="to" value="${esc(F.to)}"></div></div>` : ''}
    ${acct === 'backtest' ? '<p class="note" style="margin:-6px 0 8px">En backtest, les périodes se calent sur le dernier trade enregistré.</p>' : ''}
    ${sel('asset', 'Actif', [['Tous', 'Tous les actifs'], ...assets.map(a => [a, a])])}
    ${sel('strat', 'Méthode', [['Tous', 'Toutes les méthodes'], ['ICT', 'ICT'], ['SMC', 'SMC'], ['PA', 'Price Action']])}
    ${sel('session', 'Session', [['Tous', 'Toutes les sessions'], ...sessionNames().map(n => [n, n])])}
    ${sel('hour', 'Heure ou tranche horaire', [['Tous', 'Toutes les heures'], ['none', 'Heure inconnue'], ...bandOpts, ...hourOpts])}
    ${sel('dow', 'Jour de la semaine', [['Tous', 'Tous les jours'], ...DOW_ORDER.map(d => [String(d), DOW[d]])])}
    ${sel('result', 'Résultat', [['Tous', 'Tous les résultats'], ['Gain', 'Gagnants'], ['Perte', 'Perdants'], ['BE', 'À l’équilibre']])}
    <button class="primary press" style="margin-top:8px" data-act="close">Voir les résultats</button>`);
}
