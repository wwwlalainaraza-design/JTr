<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>JTr, maquette</title>
<style>
:root{
  --accent-rgb:29,91,255;
  --bg:#F2F5FB; --surface:#FFFFFF; --surface2:#E9EEF9; --ink:#0B1B3A; --muted:#5B6B8C; --line:#D9E0F0;
  --blue:#1D5BFF; --on-blue:#FFFFFF; --blue-soft:#DDE7FF;
  --hero:#1236C8;
  --gain-rgb:12,154,104; --loss-rgb:219,47,74; --gain:#0C9A68; --loss:#DB2F4A; --flat:#6F7C97; --on-sem:#FFFFFF;
  --gain-soft:#D6F4E7; --loss-soft:#FCDDE3; --flat-soft:#E6EAF2;
  --buy:#1D5BFF; --sell:#C96A00; --on-sell:#FFFFFF;
  --reel:#1D5BFF; --bt:#5B3FE6;
  --ict:#1D5BFF; --smc:#7A5AF8; --pa:#0A7C99;
  --shadow:0 1px 2px rgba(11,27,58,.06),0 10px 28px rgba(11,27,58,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060D1E; --surface:#0E1932; --surface2:#162548; --ink:#E8EEFF; --muted:#8CA0C8; --line:#1E3160;
    --blue:#5B90FF; --on-blue:#04122E; --blue-soft:#16316D;
    --hero:#0F2D7A;
    --gain-rgb:52,211,153; --loss-rgb:251,113,133; --gain:#34D399; --loss:#FB7185; --flat:#9AA8C4; --on-sem:#05140F;
    --gain-soft:#0C3A2D; --loss-soft:#47182A; --flat-soft:#1A2644;
    --buy:#6EA0FF; --sell:#F5B04A; --on-sell:#2A1600;
    --reel:#5B90FF; --bt:#9B8AFF;
    --ict:#6EA0FF; --smc:#A592FF; --pa:#35C6E3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#060D1E; --surface:#0E1932; --surface2:#162548; --ink:#E8EEFF; --muted:#8CA0C8; --line:#1E3160;
    --blue:#5B90FF; --on-blue:#04122E; --blue-soft:#16316D;
    --hero:#0F2D7A;
    --gain-rgb:52,211,153; --loss-rgb:251,113,133; --gain:#34D399; --loss:#FB7185; --flat:#9AA8C4; --on-sem:#05140F;
    --gain-soft:#0C3A2D; --loss-soft:#47182A; --flat-soft:#1A2644;
    --buy:#6EA0FF; --sell:#F5B04A; --on-sell:#2A1600;
    --reel:#5B90FF; --bt:#9B8AFF;
    --ict:#6EA0FF; --smc:#A592FF; --pa:#35C6E3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.35}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.screen{display:none;padding:18px 16px 24px}
.screen.active{display:block}
.screen.enter{animation:enter .26s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:17px;letter-spacing:-.01em;margin:24px 0 10px}
.muted{color:var(--muted)}
small{font-size:12.5px}
.press{transition:transform .12s ease,filter .12s ease}
.press:active{transform:scale(.95)}
.note{font-size:12.5px;color:var(--muted);margin:10px 4px 0}
.g{color:var(--gain)} .l{color:var(--loss)} .f{color:var(--flat)}

/* Marque */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;margin:2px 2px 14px}
.brand svg{width:30px;height:30px;border-radius:9px}

/* Hero */
.hero{background:var(--hero);color:#fff;border-radius:30px 30px 30px 8px;padding:20px 18px 14px;box-shadow:var(--shadow)}
.hero>small{opacity:.78;font-size:13px}
.hero .big{font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:2px 0 6px}
.hero .big span{font-size:24px;font-weight:600;margin-left:6px;opacity:.8;letter-spacing:0}
.hero .mini{display:flex;gap:18px;font-size:13px;opacity:.9}
.hero svg{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.hero .empty-curve{margin:18px 0 14px;font-size:14px;opacity:.85}
.hero .seg{background:rgba(255,255,255,.14);margin-top:8px;--thumb:#fff}
.hero .seg button{color:rgba(255,255,255,.82)}
.hero .seg button.on{color:#0B1B3A}
.pulse{transform-origin:center;animation:pulse 1.8s ease-out 1.1s infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}

/* Segment */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:18px;padding:4px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,1));border-radius:14px;background:var(--thumb,var(--blue));
  transform:translateX(calc(var(--i,0)*100%));transition:transform .32s cubic-bezier(.3,1.25,.5,1),background .3s}
.seg button{position:relative;z-index:1;padding:11px 4px;border-radius:14px;font-weight:600;font-size:14.5px;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--on-blue)}

/* Cartes et indicateurs */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;padding:6px 16px}
.kpi{padding:12px 0;border-bottom:1px solid var(--line)}
.kpi:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.kpi:nth-child(even){padding-left:16px}
.kpi:nth-last-child(-n+2){border-bottom:0}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:12px}
.demo button{font-weight:700;color:var(--blue);padding:6px 8px}
.link{color:var(--blue);font-weight:600;font-size:14px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between}

/* Lignes de trades */
.trade{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border-radius:18px;padding:12px 14px 12px 0;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.trade .strip{align-self:stretch;border-radius:0 6px 6px 0;background:var(--c)}
.trade small{display:block;margin-top:2px}
.dirtag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:4px}
.dirtag.buy{background:var(--blue-soft);color:var(--buy)}
.dirtag.sell{background:rgba(201,106,0,.15);color:var(--sell)}
.rbadge{min-width:66px;text-align:center;padding:8px 10px;border-radius:12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.rbadge.gain{background:var(--gain-soft);color:var(--gain)}
.rbadge.loss{background:var(--loss-soft);color:var(--loss)}
.rbadge.flat{background:var(--flat-soft);color:var(--flat)}
.rbadge.pending{background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px}
.rbadge.lg{font-size:18px;padding:10px 14px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:8px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:9px 13px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--blue);color:var(--on-blue);animation:pop .24s ease}
.chip.res-gain.on{background:var(--gain);color:var(--on-sem)}
.chip.res-loss.on{background:var(--loss);color:var(--on-sem)}
.chip.res-flat.on{background:var(--flat);color:var(--on-sem)}
.chip.static{background:var(--surface2);font-size:13px;padding:7px 11px}
@keyframes pop{50%{transform:scale(1.09)}}

/* Formulaire */
.concepts{margin:14px 0 6px}
.concepts.swap{animation:swap .3s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.cgroup{margin-bottom:14px}
.gname{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
input:disabled{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.bad input,.field.bad select{border-color:var(--loss)}
.field .msg{color:var(--loss);font-size:12.5px;margin-top:6px}
.field.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.dir{padding:16px;border-radius:18px;font-weight:700;font-size:17px;background:var(--surface2);color:var(--muted);transition:background .2s,color .2s}
.dir.on.buy{background:var(--buy);color:var(--on-blue)}
.dir.on.sell{background:var(--sell);color:var(--on-sell)}
.rowsw{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow);font-weight:600}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--surface2);transition:background .25s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"] i{transform:translateX(22px)}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.expand.open{grid-template-rows:1fr}
.expand>div{overflow:hidden}
.savebar{position:sticky;bottom:calc(98px + env(safe-area-inset-bottom));margin-top:18px;z-index:5}
.primary{width:100%;padding:17px;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:17px;box-shadow:0 10px 24px rgba(var(--accent-rgb),.35)}
.ghost{width:100%;padding:14px;border-radius:16px;background:var(--surface2);font-weight:600}
.dangerbtn{width:100%;padding:14px;border-radius:16px;background:var(--loss-soft);color:var(--loss);font-weight:700}
.cancel{color:var(--muted);font-weight:600;font-size:14px;margin:0 0 8px;display:inline-block}

/* Statistiques */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1s cubic-bezier(.3,.7,.2,1)}
.ring b{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:28px;letter-spacing:-.03em}
.counts{display:grid;gap:8px;font-size:14px}
.counts div{display:flex;align-items:center;gap:8px}
.counts i{width:10px;height:10px;border-radius:50%}
.sblock{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:6px solid var(--c)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sname{font-weight:700;font-size:18px;color:var(--c)}
.spark{width:100%;height:34px;display:block;margin:8px 0 4px}
.spark path{stroke:var(--c)}
.smetrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.smetrics b{display:block;font-size:15px}
.smetrics span{font-size:11.5px;color:var(--muted)}
.brow{display:grid;grid-template-columns:104px 1fr 54px;gap:10px;align-items:center;margin:12px 0}
.blab b{display:block;font-size:14px}
.btrack{position:relative;height:16px;background:var(--surface2);border-radius:8px}
.btrack .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.bar{position:absolute;top:2px;bottom:2px;border-radius:6px;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.bar.pos{background:var(--gain);transform-origin:left}
.bar.neg{background:var(--loss);transform-origin:right}
@keyframes grow{from{transform:scaleX(0)}}
.bval{font-weight:700;font-size:14px;text-align:right}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs .card b{display:block;font-size:26px;letter-spacing:-.03em}
.empty{text-align:center;padding:36px 18px}
.empty p{color:var(--muted);margin:8px 0 18px}
.empty .primary{max-width:280px}

/* Paramètres */
.list{padding:6px 16px}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:16px 0;font-weight:600;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow small{color:var(--muted);font-weight:400}
.srow.danger{color:var(--loss)}

/* Barre d'onglets */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);
  box-shadow:0 -6px 24px rgba(11,27,58,.1);border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(14px + env(safe-area-inset-bottom));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:6px 0;transition:color .2s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.tab.active{color:var(--blue)}
.tab.active svg{transform:translateY(-2px) scale(1.12)}
.tab.fab .bubble{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;margin-top:-30px;
  box-shadow:0 8px 22px rgba(var(--accent-rgb),.45);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab.fab svg{stroke-width:2.6}
.tab.fab.active svg{transform:rotate(90deg)}
.tab.fab.active{color:var(--blue)}
.tabbar .bar-i{position:absolute;bottom:6px;left:6px;width:calc((100% - 12px)/5);height:4px;display:flex;justify-content:center;
  transform:translateX(calc(var(--i,0)*100%));transition:transform .38s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tabbar .bar-i::after{content:"";width:22px;height:4px;border-radius:4px;background:var(--blue)}

/* Feuille et message */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,10,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);background:var(--surface);
  border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:50;
  transition:transform .34s cubic-bezier(.2,.9,.25,1);max-height:86vh;max-height:86dvh;overflow:auto}
.sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.facts small{display:block;color:var(--muted)}
.facts b{font-size:14.5px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;
  transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Compte, concepts, captures */
/* Couleurs des comptes */
body[data-accent="violet"]{--hero:#3A2BB8;--blue:#5B3FE6;--blue-soft:#E6E0FF;--on-blue:#FFFFFF;--accent-rgb:91,63,230}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-accent="violet"]{--hero:#2B2378;--blue:#9B8AFF;--blue-soft:#2B2378;--on-blue:#120A3A}}
:root[data-theme="dark"] body[data-accent="violet"]{--hero:#2B2378;--blue:#9B8AFF;--blue-soft:#2B2378;--on-blue:#120A3A}
body[data-accent="teal"]{--hero:#0B6E78;--blue:#0E8A96;--blue-soft:#D5F2F4;--on-blue:#FFFFFF;--accent-rgb:14,138,150}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-accent="teal"]{--hero:#0A4A52;--blue:#4FD1DC;--blue-soft:#0E3A40;--on-blue:#04282C}}
:root[data-theme="dark"] body[data-accent="teal"]{--hero:#0A4A52;--blue:#4FD1DC;--blue-soft:#0E3A40;--on-blue:#04282C}
body[data-accent="orange"]{--hero:#B4500B;--blue:#C95A0A;--blue-soft:#FDE6D0;--on-blue:#FFFFFF;--accent-rgb:201,90,10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-accent="orange"]{--hero:#6B3308;--blue:#FF9F5A;--blue-soft:#4A2A10;--on-blue:#2A1200}}
:root[data-theme="dark"] body[data-accent="orange"]{--hero:#6B3308;--blue:#FF9F5A;--blue-soft:#4A2A10;--on-blue:#2A1200}
body[data-accent="pink"]{--hero:#A5185F;--blue:#C42774;--blue-soft:#FBDDEB;--on-blue:#FFFFFF;--accent-rgb:196,39,116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-accent="pink"]{--hero:#6E1040;--blue:#FF7FB8;--blue-soft:#4A1230;--on-blue:#3A0620}}
:root[data-theme="dark"] body[data-accent="pink"]{--hero:#6E1040;--blue:#FF7FB8;--blue-soft:#4A1230;--on-blue:#3A0620}
body[data-accent="slate"]{--hero:#334155;--blue:#475569;--blue-soft:#E2E8F0;--on-blue:#FFFFFF;--accent-rgb:71,85,105}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-accent="slate"]{--hero:#263244;--blue:#94A3B8;--blue-soft:#1E293B;--on-blue:#0F172A}}
:root[data-theme="dark"] body[data-accent="slate"]{--hero:#263244;--blue:#94A3B8;--blue-soft:#1E293B;--on-blue:#0F172A}
.acctrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;margin-top:8px;background:var(--surface2);border:2px solid transparent}
.acctrow.on{border-color:var(--blue)}
.acctrow .dot{width:16px;height:16px;border-radius:50%;flex:none}
.acctrow small{display:block;color:var(--muted);font-weight:400}
.acctrow .acctedit{margin-left:auto;color:var(--blue);font-weight:600;font-size:13px;padding:8px 6px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.bt{background:rgba(122,90,248,.16);color:var(--smc)}
.chead{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.chead b{font-size:15px}
.clearall{color:var(--blue);font-weight:600;font-size:13.5px;padding:6px 4px}
.combo{margin:8px 0 2px;padding:10px 12px;border-radius:14px;background:var(--blue-soft);font-size:13.5px}
.combo.empty-c{background:var(--surface2);color:var(--muted)}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shot{position:relative;width:92px;height:68px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px;text-align:center}
.field .addshot{width:92px;height:68px;border-radius:12px;border:1.5px dashed var(--blue);color:var(--blue);display:grid;place-items:center;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;margin:0;padding:4px}
.addshot input{display:none}
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(2,6,20,.94);display:none;align-items:center;justify-content:center;padding:14px}
.viewer.show{display:flex;animation:enter .2s}
.viewer img{max-width:100%;max-height:92vh;max-height:92dvh;border-radius:12px}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow b{font-size:14px;word-break:break-word}
.crow small{grid-column:1/-1;color:var(--muted)}

/* Analyse des performances */
.logo .cover{transform-box:view-box;transform-origin:39px 54px;animation:closebook .9s cubic-bezier(.3,.8,.3,1) .25s both}
@keyframes closebook{from{transform:scaleX(-1)}to{transform:scaleX(1)}}
.tbl{overflow-x:auto;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl thead th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface)}
.tbl tbody th{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600}
.tbl thead th:first-child{text-align:left;position:sticky;left:0;z-index:2}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl tr.none th,.tbl tr.none td{opacity:.45}
.tbl tr.low td,.tbl td.low{opacity:.55}
.tbl tr[data-hr]{cursor:pointer}
.tbl.mx td small{display:block;color:var(--muted);font-size:11px}
.lowtag{font-style:normal;font-size:10.5px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:8px;margin-left:6px;font-weight:500}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.qbox{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 12px;color:var(--muted)}
.qbox div+div{margin-top:4px}
.chip.flt{background:var(--blue-soft);color:var(--blue);font-weight:700}
.chip.flt.on-flt{background:var(--blue);color:var(--on-blue)}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kcard{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kcard b{display:block;font-size:18px;letter-spacing:-.02em}
.kcard span{font-size:11.5px;color:var(--muted)}
.chart{background:var(--surface);border-radius:20px;padding:12px 8px 6px;box-shadow:var(--shadow);margin-top:12px}
.chart svg{width:100%;height:auto;display:block}
.chart h3{margin:0 8px 6px;font-size:14.5px}
.chart .note{margin:4px 8px 8px}
.smetrics.c4{grid-template-columns:repeat(4,1fr);row-gap:12px}
.split{display:flex;width:72px;height:8px;border-radius:4px;overflow:hidden;margin-left:auto}
.split .sg{background:var(--gain)}.split .sl{background:var(--loss)}
.minput{width:90px;display:inline-block;padding:8px 10px}
.cardrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Time frames des concepts et signature */
.tfrow{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 4px 6px 10px;margin:2px 0 4px 4px;border-left:3px solid var(--blue);animation:tfin .18s ease}
@keyframes tfin{from{opacity:0;transform:translateY(-4px)}}
.tfl{font-size:12px;color:var(--muted);margin-right:2px}
.tfchip{padding:6px 11px;border-radius:10px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--ink);transition:background .15s,color .15s}
.tfchip.on{background:var(--blue);color:var(--on-blue);animation:pop .2s ease}
#curve,.chart{position:relative}
.sig{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:italic 700 30px/1 "Segoe Script","Brush Script MT","Lucida Handwriting",cursive;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45);pointer-events:none;animation:sigin 3.2s ease both}
.chart .sig{color:var(--blue);text-shadow:none}
@keyframes sigin{0%{opacity:0;transform:translateY(-50%) scale(.85)}15%{opacity:1;transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

/* Calendrier et remarques */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calnav b{font-size:18px;letter-spacing:-.01em}
.calnav button[data-calnav]{width:42px;height:42px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;color:var(--blue);line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{min-height:56px;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--surface);box-shadow:var(--shadow);font-size:11px;color:var(--muted)}
.day span{color:var(--muted);font-size:11px}
.day b{font-size:12px;letter-spacing:-.02em;color:var(--ink)}
.day.empty{background:transparent;box-shadow:none}
.day.off{background:var(--surface2);box-shadow:none;opacity:.65}
.day.pos{background:rgba(var(--gain-rgb),var(--a))}
.day.neg{background:rgba(var(--loss-rgb),var(--a))}
.day.flat{background:var(--flat-soft)}
.day.pos span,.day.neg span{color:var(--ink)}
.day.istoday{outline:2px solid var(--blue);outline-offset:-2px}
button.day{cursor:pointer;transition:transform .12s}
button.day:active{transform:scale(.93)}
.rem{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:8px;border-left:5px solid transparent;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.rem.green{background:rgba(var(--gain-rgb),.4);border-color:var(--gain)}
.rem.red{background:rgba(var(--loss-rgb),.4);border-color:var(--loss)}
.rem small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);white-space:normal}
.addrem{display:block;width:100%;padding:10px;border-radius:12px;border:1.5px dashed var(--line);color:var(--blue);font-weight:600;font-size:14px;margin-bottom:12px}

/* Journal et calendrier, remarques */
.callegend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px 10px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.lg.pos{background:rgba(var(--gain-rgb),.5)}.lg.neg{background:rgba(var(--loss-rgb),.5)}.lg.flat{background:var(--surface2);border:1px solid var(--line)}
.calh{font-size:10.5px;letter-spacing:.03em}
.day{cursor:pointer;border:0;font:inherit;color:inherit}
div.day{cursor:default}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.remwrap{margin:14px 0 4px}
.remwrap .gname{margin-bottom:8px}
.dayfilter{margin:0 0 10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
/* Diagnostic : affiche l'erreur à l'écran si le script ne démarre pas (ES5, volontairement très simple). */
(function () {
  var box;
  try { var th = localStorage.getItem('jtr-theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  function show(msg) {
    if (!box) {
      box = document.createElement('div');
      box.id = 'jtrdiag';
      box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#7f1d1d;color:#fff;font:12px/1.45 sans-serif;padding:10px 12px;border-radius:10px;max-height:60vh;overflow:auto;word-break:break-word';
      (document.body || document.documentElement).appendChild(box);
    }
    var d = document.createElement('div'); d.style.marginBottom = '6px'; d.textContent = msg; box.appendChild(d);
  }
  window.onerror = function (m, u, l, c) { show('Erreur JavaScript : ' + m + ' (ligne ' + l + ', colonne ' + c + ')'); };
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__JTR_OK) {
        show('Le script de JTr ne s\u2019est pas exécuté en entier.');
        var noms = ['jtr1.js', 'jtr2.js', 'jtr3.js', 'jtr4.js', 'jtr5.js'], ok = [window.__JTR_P1, window.__JTR_P2, window.__JTR_P3, window.__JTR_P4, window.__JTR_P5], miss = [window.__JTR_M1, window.__JTR_M2, window.__JTR_M3, window.__JTR_M4, window.__JTR_M5], txt = [];
        for (var k = 0; k < 5; k++) txt.push(noms[k] + ' : ' + (ok[k] ? 'OK' : (miss[k] ? 'INTROUVABLE dans le dossier de la page' : 'trouvé mais coupé ou en erreur')));
        show('Fichiers : ' + txt.join(' ; '));
        show(document.getElementById('jtrfin') ? 'Fin de la page présente.' : 'Fin de la page ABSENTE : tradelog-maquette.html est tronqué.');
        show('Adresse de la page : ' + location.href);
        var sc = document.getElementsByTagName('script'), adr = [];
        for (var q = 0; q < sc.length; q++) if (sc[q].src) adr.push(sc[q].src);
        show('Adresses des fichiers cherchés : ' + adr.join(' ; '));
        show('Moteur : ' + navigator.userAgent);
      }
    }, 1500);
  });
})();
</script>
</head>

<div class="app">
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-history"></section>
  <section class="screen" id="s-new"></section>
  <section class="screen" id="s-stats"></section>
  <section class="screen" id="s-settings"></section>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <button class="tab press" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Accueil</button>
    <button class="tab press" data-go="history"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>Historique</button>
    <button class="tab fab" data-go="new" aria-label="Nouveau trade"><span class="bubble press"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>

    <button class="tab press" data-go="settings"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg>Paramètres</button>

<script src="jtr4.js" onerror="window.__JTR_M4=true"></script>
